name: Refresh Spotify now-playing panel

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/spotify-now-playing.yml"
      - "scripts/update_spotify.py"
      - "scripts/spotify_auth.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh track and render panel
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_URL: ${{ vars.SPOTIFY_PLAYLIST_URL }}
        run: python scripts/update_spotify.py
      - name: Commit when the panel changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spotify-now-playing.svg README.md
          if git diff --cached --quiet; then
            echo "Spotify panel is unchanged."
          else
            git commit -m "chore: refresh Spotify listening status"
            git push
          fi
