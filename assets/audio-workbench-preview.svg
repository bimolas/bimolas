<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Interactive local audio workbench preview</title>
<desc id="desc">A dark player interface with a live spectrum visualizer, track queue, timeline, volume control, play, pause, stop and skip buttons. Click the preview in the profile to open the actual browser-based player.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a22"/><stop offset="1" stop-color="#0a1016"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#178b89"/><stop offset=".55" stop-color="#69d7c0"/><stop offset="1" stop-color="#92e4be"/></linearGradient>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:#8da0ac}.main{fill:#e7f0f3}.accent{fill:#8de2bc}.small{font-size:10px;letter-spacing:1.4px}.label{font-size:12px}</style>
</defs>
