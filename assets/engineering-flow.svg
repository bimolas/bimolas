<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">From a code change to a running system</title>
  <desc id="desc">A restrained dark engineering diagram. The first panel maps the delivery cycle from understanding a problem through design, implementation, integration and release, with production feedback returning to the next iteration. The second panel shows a request moving from a client through an API gateway and load balancer to a healthy service instance. The service registers with discovery, works with data and messaging dependencies, and returns a response. Logs, metrics and traces help explain system behavior.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#79c0ff"/></marker>
    <marker id="arrow-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#6e9bbf"/></marker>
    <marker id="arrow-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b949e"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #79c0ff; font-size: 11px; font-weight: 700; letter-spacing: 1.7px; }
      .title { fill: #f0f6fc; font-size: 28px; font-weight: 650; letter-spacing: -.5px; }
      .subtitle { fill: #9da7b3; font-size: 13px; }
      .panel { fill: #0d1117; stroke: #30363d; stroke-width: 1.2; }
      .node { fill: #161b22; stroke: #3a4653; stroke-width: 1.2; }
      .node-blue { fill: #111d2a; stroke: #35658a; stroke-width: 1.25; }
      .node-teal { fill: #102320; stroke: #2e7369; stroke-width: 1.25; }
      .node-title { fill: #e6edf3; font-size: 13px; font-weight: 650; }
      .node-copy { fill: #9da7b3; font-size: 10.5px; }
      .step-number { fill: #79c0ff; font-size: 10px; font-weight: 700; letter-spacing: .8px; }
      .zone { fill: #8b949e; font-size: 10px; font-weight: 700; letter-spacing: 1.1px; }
      .line { fill: none; stroke: #79c0ff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-muted { fill: none; stroke: #6e9bbf; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-muted); }
      .line-dashed { fill: none; stroke: #8b949e; stroke-width: 1.25; stroke-linecap: round; stroke-dasharray: 4 5; marker-end: url(#arrow-soft); }
      .response-line { fill: none; stroke: #6e9bbf; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #30363d; stroke-width: 1; }
      .tag { fill: #1b2733; stroke: #3a4653; stroke-width: 1; }
      .tag-text { fill: #c9d1d9; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="960" fill="#090d12"/>
  <rect x="1" y="1" width="1198" height="958" rx="20" fill="none" stroke="#30363d"/>

  <text x="48" y="42" class="eyebrow">SOFTWARE ENGINEERING / FIELD NOTES</text>
  <text x="48" y="79" class="title">From a code change to a running system</text>
  <text x="48" y="104" class="subtitle">The work doesn’t end when the code compiles. It ends when the system behaves as intended.</text>
  <line x1="48" y1="125" x2="1152" y2="125" class="fine"/>

  <rect x="48" y="146" width="1104" height="257" rx="14" class="panel"/>
  <text x="72" y="176" class="eyebrow">01 / DELIVERY LOOP</text>
  <text x="72" y="199" class="subtitle">Five stages. One feedback loop from production back to the next change.</text>

  <path d="M240 285 H294 M462 285 H516 M684 285 H738 M906 285 H960" class="line-muted"/>
  <circle r="3.4" fill="#79c0ff">
    <animateMotion dur="6.2s" repeatCount="indefinite" path="M240 285 H1128"/>
  </circle>

  <g>
    <rect x="72" y="242" width="168" height="86" rx="9" class="node"/>
    <text x="88" y="263" class="step-number">01</text>
    <text x="88" y="283" class="node-title">Understand</text>
    <text x="88" y="304" class="node-copy">Users · constraints</text>
    <text x="88" y="318" class="node-copy">Requirements · risks</text>
  </g>
  <g>
    <rect x="294" y="242" width="168" height="86" rx="9" class="node"/>
    <text x="310" y="263" class="step-number">02</text>
    <text x="310" y="283" class="node-title">Design</text>
    <text x="310" y="304" class="node-copy">Contracts · data</text>
    <text x="310" y="318" class="node-copy">Boundaries · trade-offs</text>
  </g>
  <g>
    <rect x="516" y="242" width="168" height="86" rx="9" class="node-blue"/>
    <text x="532" y="263" class="step-number">03</text>
    <text x="532" y="283" class="node-title">Build &amp; test</text>
    <text x="532" y="304" class="node-copy">Business rules</text>
    <text x="532" y="318" class="node-copy">Automated checks</text>
  </g>
  <g>
    <rect x="738" y="242" width="168" height="86" rx="9" class="node-blue"/>
    <text x="754" y="263" class="step-number">04</text>
    <text x="754" y="283" class="node-title">Integrate</text>
    <text x="754" y="304" class="node-copy">Service contracts</text>
    <text x="754" y="318" class="node-copy">Dependencies · CI</text>
  </g>
  <g>
    <rect x="960" y="242" width="168" height="86" rx="9" class="node-teal"/>
    <text x="976" y="263" class="step-number">05</text>
    <text x="976" y="283" class="node-title">Release &amp; learn</text>
    <text x="976" y="304" class="node-copy">Deploy · observe</text>
    <text x="976" y="318" class="node-copy">Fix · improve</text>
  </g>

  <path d="M1044 328 V356 H808" class="line-muted"/>
  <path d="M392 356 H156 V328" class="line-muted"/>
  <rect x="401" y="343" width="398" height="26" rx="13" fill="#0d1117" stroke="#30363d"/>
  <text x="600" y="359.5" text-anchor="middle" class="tag-text">PRODUCTION FEEDBACK SHAPES THE NEXT ITERATION</text>

  <rect x="48" y="425" width="1104" height="490" rx="14" class="panel"/>
  <text x="72" y="455" class="eyebrow">02 / RUNTIME PATH</text>
  <text x="72" y="482" class="title" style="font-size:22px">One request, end to end</text>
  <text x="72" y="505" class="subtitle">Discovery provides the available instances; the load balancer selects one healthy target.</text>

  <path d="M820 478 H860" class="line"/>
  <text x="870" y="482" class="node-copy">Request / response</text>
  <path d="M820 501 H860" class="line-dashed"/>
  <text x="870" y="505" class="node-copy">Registration / discovery</text>

  <text x="72" y="548" class="zone">CLIENT EDGE</text>
  <line x1="72" y1="558" x2="374" y2="558" class="fine"/>
  <text x="420" y="548" class="zone">ROUTING</text>
  <line x1="420" y1="558" x2="570" y2="558" class="fine"/>
  <text x="620" y="548" class="zone">APPLICATION</text>
  <line x1="620" y1="558" x2="838" y2="558" class="fine"/>
  <text x="900" y="548" class="zone">DEPENDENCIES</text>
  <line x1="900" y1="558" x2="1110" y2="558" class="fine"/>

  <rect x="620" y="634" width="218" height="153" rx="11" fill="#0b141d" stroke="#30404e" stroke-width="1.1"/>

  <path d="M729 634 V606 H570" class="line-dashed"/>
  <path d="M495 628 V663" class="line-dashed"/>
  <text x="645" y="600" class="node-copy" style="font-size:9.5px">REGISTER / HEARTBEAT</text>

  <path d="M184 701 H224" class="line"/>
  <path d="M374 701 H420" class="line"/>
  <path d="M570 701 H593 V688 H636" class="line"/>
  <path d="M593 701 V740 H636" class="line"/>

  <circle r="3.5" fill="#a5d6ff">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M184 701 H224 H374 H420 H570 H593 V688 H636"/>
  </circle>

  <path d="M838 701 H866 V694 H900" class="line-muted"/>
  <path d="M866 701 V756 H900" class="line-muted"/>

  <path d="M729 787 V817 H781" class="response-line"/>
  <path d="M390 817 H128 V739" class="line-muted"/>
  <circle r="3" fill="#8b949e">
    <animateMotion dur="6.8s" begin="-2.2s" repeatCount="indefinite" path="M729 787 V817 H128 V739"/>
  </circle>
  <rect x="397" y="805" width="384" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="589" y="821" text-anchor="middle" class="tag-text">RESPONSE RETURNS THROUGH THE GATEWAY TO THE CLIENT</text>

  <g>
    <rect x="72" y="663" width="112" height="76" rx="9" class="node"/>
    <text x="128" y="693" text-anchor="middle" class="node-title">Client</text>
    <text x="128" y="712" text-anchor="middle" class="node-copy">Web / mobile</text>
  </g>
  <g>
    <rect x="224" y="663" width="150" height="76" rx="9" class="node-blue"/>
    <text x="299" y="693" text-anchor="middle" class="node-title">API gateway</text>
    <text x="299" y="712" text-anchor="middle" class="node-copy">Route · policy</text>
  </g>
  <g>
    <rect x="420" y="663" width="150" height="76" rx="9" class="node-blue"/>
    <text x="495" y="691" text-anchor="middle" class="node-title">Load balancer</text>
    <text x="495" y="709" text-anchor="middle" class="node-copy">Choose one healthy</text>
    <text x="495" y="722" text-anchor="middle" class="node-copy">service instance</text>
  </g>
  <g>
    <rect x="420" y="582" width="150" height="46" rx="8" class="node"/>
    <text x="495" y="601" text-anchor="middle" class="node-title" style="font-size:11px">Service registry</text>
    <text x="495" y="616" text-anchor="middle" class="node-copy" style="font-size:9.5px">Registered instances</text>
  </g>
  <g>
    <rect x="636" y="667" width="186" height="42" rx="7" class="node-blue"/>
    <text x="649" y="684" class="node-title" style="font-size:11.5px">Service instance A</text>
    <text x="649" y="699" class="node-copy" style="font-size:9.5px">Healthy target</text>
  </g>
  <g>
    <rect x="636" y="719" width="186" height="42" rx="7" class="node-blue"/>
    <text x="649" y="736" class="node-title" style="font-size:11.5px">Service instance B</text>
    <text x="649" y="751" class="node-copy" style="font-size:9.5px">Another eligible target</text>
  </g>
  <g>
    <rect x="900" y="668" width="210" height="52" rx="8" class="node"/>
    <text x="916" y="690" class="node-title">Data store</text>
    <text x="916" y="707" class="node-copy">Read / write application state</text>
  </g>
  <g>
    <rect x="900" y="730" width="210" height="52" rx="8" class="node"/>
    <text x="916" y="752" class="node-title">Message broker</text>
    <text x="916" y="769" class="node-copy">Publish events for async work</text>
  </g>

  <rect x="72" y="850" width="1038" height="43" rx="9" fill="#111820" stroke="#30363d" stroke-width="1.1"/>
  <text x="91" y="876" class="node-title" style="font-size:11px">OBSERVABILITY</text>
  <rect x="220" y="861" width="60" height="22" rx="6" class="tag"/>
  <text x="250" y="875.5" text-anchor="middle" class="tag-text">Logs</text>
  <rect x="289" y="861" width="72" height="22" rx="6" class="tag"/>
  <text x="325" y="875.5" text-anchor="middle" class="tag-text">Metrics</text>
  <rect x="370" y="861" width="60" height="22" rx="6" class="tag"/>
  <text x="400" y="875.5" text-anchor="middle" class="tag-text">Traces</text>
  <text x="450" y="876" class="node-copy">Signals across the gateway, services and dependencies help explain behavior and failures.</text>

  <text x="1152" y="942" text-anchor="end" fill="#6e7681" font-size="10">CONCEPTUAL PATTERN · COMPONENTS VARY BY STACK</text>
</svg>