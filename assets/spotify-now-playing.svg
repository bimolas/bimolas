<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Spotify listening status: NOT LINKED</title>
  <desc id="desc">A custom Spotify-inspired dark panel showing current track status. This visual does not play audio.</desc>
  <defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a20"/><stop offset="1" stop-color="#0a0f14"/></linearGradient>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:#8b9aa7}.white{fill:#e6edf3}.small{font-size:10px;letter-spacing:1.2px}@keyframes eq{from{transform:scaleY(.32);opacity:.55}to{transform:scaleY(1);opacity:1}}</style></defs>
  <rect width="1200" height="170" rx="15" fill="url(#panel)" stroke="#2b3c3e"/><rect x="1" y="1" width="1198" height="168" rx="14" fill="none" stroke="#1ed760" stroke-opacity=".12"/>
  <circle cx="68" cy="85" r="31" fill="#1ed760"/><path d="M48 75Q68 68 88 78M51 85Q68 80 85 88M55 95Q68 91 81 98" fill="none" stroke="#07110a" stroke-width="4.5" stroke-linecap="round"/>
  <text x="122" y="39" class="small" fill="#1ed760">SPOTIFY / SETUP</text><text x="122" y="72" class="white" font-size="23" font-weight="700">Your soundtrack, live</text><text x="122" y="98" class="muted" font-size="14">Connect Spotify once to show the track playing on your account.</text>
  <line x1="122" y1="118" x2="940" y2="118" stroke="#273740"/><text x="122" y="140" class="muted small">WAITING FOR SPOTIFY CREDENTIALS</text><text x="940" y="140" text-anchor="end" fill="#93a4ad" class="small">ADD PLAYLIST URL</text>
  <g><rect x="1050" y="71" width="4" height="12" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.00s infinite alternate"/><rect x="1058" y="62" width="4" height="21" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.09s infinite alternate"/><rect x="1066" y="68" width="4" height="15" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.18s infinite alternate"/><rect x="1074" y="54" width="4" height="29" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.27s infinite alternate"/><rect x="1082" y="66" width="4" height="17" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.36s infinite alternate"/><rect x="1090" y="58" width="4" height="25" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.45s infinite alternate"/><rect x="1098" y="72" width="4" height="11" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.54s infinite alternate"/><rect x="1106" y="61" width="4" height="22" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.63s infinite alternate"/><rect x="1114" y="68" width="4" height="15" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.72s infinite alternate"/><rect x="1122" y="56" width="4" height="27" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.81s infinite alternate"/><rect x="1130" y="70" width="4" height="13" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.90s infinite alternate"/><rect x="1138" y="63" width="4" height="20" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 0.99s infinite alternate"/><rect x="1146" y="73" width="4" height="10" rx="2" fill="#1ed760" style="transform-origin:bottom;animation:eq 1.05s ease-in-out 1.08s infinite alternate"/></g><circle cx="1137" cy="36" r="4" fill="#1ed760"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle><text x="1150" y="40" text-anchor="end" fill="#1ed760" class="small">NOT LINKED</text>
</svg>